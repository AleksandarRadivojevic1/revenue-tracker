name: CI

on:
  push:
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24   # same as the Docker image; node:sqlite is built in
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
